    <style>
        /* ================= DESIGN SYSTEM TOKENS (Green Theme) ================= */
        :root {
            --bg-surface: #F9FAFB; /* Nền hơi xám sáng nhẹ cho sang trọng */
            --text-primary: #14532D; /* Xanh lá đậm */
            --text-muted: #166534; /* Xanh lá nhạt hơn chút */
            --bg-elevated: #F0FDF4; /* Xanh pastel rất nhạt cho nền khối */
            --border-color: #BBF7D0; /* Xanh mint cho viền */
            --radius-btn: 30px;
            --radius-input: 24px;
        }

        body {
            font-family: 'Outfit', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-surface);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }
        
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .masonry-grid { 
            column-count: 2; 
            column-gap: 12px; 
        }
        .masonry-item { 
            break-inside: avoid; 
            margin-bottom: 24px; 
            display: inline-block;
            width: 100%;
        }
        @media (min-width: 768px) { 
            .masonry-grid { column-count: 3; column-gap: 16px; } 
        }
        @media (min-width: 1024px) { 
            .masonry-grid { column-count: 4; column-gap: 24px; } 
        }

        .btn-solid {
            background-color: var(--text-primary);
            color: var(--bg-surface);
            border-radius: var(--radius-btn);
            padding: 12px 24px;
            font-weight: 500;
            font-size: 16px;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.15s, background-color 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            box-shadow: none;
        }
        .btn-solid:active { transform: scale(0.96); opacity: 0.8; }
        .btn-solid:hover { background-color: #064E3B; }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border-radius: var(--radius-btn);
            padding: 12px 24px;
            font-weight: 500;
            font-size: 16px;
            border: 1px solid var(--text-primary);
            transition: transform 0.15s, background-color 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: none;
        }
        .btn-outline:active { transform: scale(0.96); }
        .btn-outline:hover { background-color: var(--bg-elevated); }

        .input-flat {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: var(--radius-input);
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid transparent;
            outline: none;
            width: 100%;
            transition: border-color 0.15s;
            box-shadow: none;
        }
        .input-flat:focus {
            border-color: var(--text-primary);
        }

        .tag-btn {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: var(--radius-btn);
            padding: 7px 15px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }
        @media (min-width: 768px) {
            .tag-btn {
                padding: 8px 20px;
                font-size: 14px;
            }
        }
        .tag-btn:hover { border-color: var(--border-color); }
        .tag-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-surface);
        }

        /* ================= TÙY CHỈNH ANIMATION CHUYÊN NGHIỆP ================= */
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(25px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-fade-up { opacity: 0; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { 0% { opacity: 0; backdrop-filter: blur(0px); } 100% { opacity: 1; backdrop-filter: blur(12px); } }
        .animate-fade-in { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
        
        /* Hiệu ứng trôi nổi cho họa tiết lá */
        @keyframes float-leaf {
            0% { transform: translateY(0px) rotate(0deg) translateX(0px); }
            33% { transform: translateY(-20px) rotate(10deg) translateX(15px); }
            66% { transform: translateY(-10px) rotate(-5deg) translateX(-10px); }
            100% { transform: translateY(0px) rotate(0deg) translateX(0px); }
        }
        .leaf-decor {
            position: fixed;
            z-index: 0;
            opacity: 0.05;
            pointer-events: none;
            animation: float-leaf 12s ease-in-out infinite;
        }
        .leaf-1 { top: 5%; left: -5%; width: 250px; }
        .leaf-2 { top: 35%; right: -5%; width: 300px; animation-delay: -3s; animation-duration: 15s; }
        .leaf-3 { bottom: 10%; left: 15%; width: 180px; animation-delay: -7s; }
        
        /* Kính mờ hiện đại (Glassmorphism) */
        .glass-nav {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(187, 247, 208, 0.4);
        }

        /* Thẻ sản phẩm cao cấp */
        .fancy-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .fancy-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 40px -10px rgba(20, 83, 45, 0.15), 0 10px 15px -5px rgba(20, 83, 45, 0.05);
            border-color: var(--text-primary);
        }
        .fancy-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
            pointer-events: none;
        }
    </style>
</head>

        const _part2 = "NXkydmlrSmZGOHNR";
        const _part3 = "RWl5YnBZSmx0VFE9";
        const IK_PRIVATE_KEY = atob(_part1 + _part2 + _part3); // Trình duyệt sẽ tự động giải mã khi chạy
        const IK_UPLOAD_ENDPOINT = "https://upload.imagekit.io/api/v1/files/upload";
        const IK_AUTH = btoa(IK_PRIVATE_KEY + ":");

        // BỘ DANH MỤC (Có thể chỉnh sửa tại đây nếu cần)
        const CATEGORIES = ['Tất cả', 'Crocs', 'Áo Đấu', 'Dép Daily', 'Giày', 'Phụ kiện khác', 'Crocs 2hand'];
        
        // Khai báo các biến lưu trữ trạng thái
        let shoesData = [];
        let currentFilter = 'Tất cả';
        let currentAdminFilter = 'Tất cả';
        let activeUploadCategory = 'Crocs';

        const tagsContainer = document.getElementById('tags-container');
        const catalogGrid = document.getElementById('catalog-grid');
        const loader = document.getElementById('loader');
        
        const modal = document.getElementById('product-modal');
        const modalImg = document.getElementById('modal-img');
        const modalSize = document.getElementById('modal-size-text');
        const modalNote = document.getElementById('modal-note-text');
        
        const adminSec = document.getElementById('admin-section');
        const uploadCategoryBtns = document.getElementById('upload-category-btns');
        const adminTagsContainer = document.getElementById('admin-tags-container');
        const adminProductList = document.getElementById('admin-product-list');
        const editSelectCat = document.getElementById('edit-category');
        
        // Thống kê Analytics (Lưu riêng thành views_pint_store để ko bị lẫn với web 2 sau này)
        async function updatePageViews() {
            if(sessionStorage.getItem('visited')) return;
            sessionStorage.setItem('visited', 'true');
            
            try {
                const now = new Date();
                const vnTime = new Date(now.getTime() + (7 * 60 * 60 * 1000));
                const yyyy = vnTime.getUTCFullYear();
                const mm = String(vnTime.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(vnTime.getUTCDate()).padStart(2, '0');
                
                const dayKey = `${yyyy}-${mm}-${dd}`;
                const monthKey = `${yyyy}-${mm}`;
                
                const statRef = doc(db, 'analytics', 'views_pint_store');
                await setDoc(statRef, {
                    [dayKey]: increment(1),
                    [monthKey]: increment(1)
                }, { merge: true });
            } catch(e) { /* Đã ẩn cảnh báo để tránh rối console của trình duyệt khách hàng */ }
        }

        async function loadStatsForAdmin() {
            try {
                const now = new Date();
                const vnTime = new Date(now.getTime() + (7 * 60 * 60 * 1000));
                const yyyy = vnTime.getUTCFullYear();
                const mm = String(vnTime.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(vnTime.getUTCDate()).padStart(2, '0');
                const dayKey = `${yyyy}-${mm}-${dd}`;
                const monthKey = `${yyyy}-${mm}`;
                
                const docSnap = await getDoc(doc(db, 'analytics', 'views_pint_store'));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('stat-today').innerText = data[dayKey] || 0;
                    document.getElementById('stat-month').innerText = data[monthKey] || 0;
                }
            } catch (e) { /* Đã ẩn cảnh báo */ }
        }

        // Render Tags
        CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `tag-btn ${cat === 'Tất cả' ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('#tags-container .tag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = cat;
                renderCatalog();
            };
            tagsContainer.appendChild(btn);
            
            if(cat !== 'Tất cả') {
                const upBtn = document.createElement('button');
                upBtn.className = `tag-btn ${cat === activeUploadCategory ? 'active' : 'bg-transparent border border-[#BBF7D0]'}`;
                upBtn.innerText = cat;
                upBtn.onclick = () => {
                    document.querySelectorAll('#upload-category-btns .tag-btn').forEach(b => {
                        b.classList.remove('active');
                        b.classList.add('bg-transparent', 'border', 'border-[#BBF7D0]');
                    });
                    upBtn.classList.add('active');
                    upBtn.classList.remove('bg-transparent', 'border', 'border-[#BBF7D0]');
                    activeUploadCategory = cat;
                };
                uploadCategoryBtns.appendChild(upBtn);

                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat;
                editSelectCat.appendChild(opt);
            }

            const adBtn = document.createElement('button');
            adBtn.className = `tag-btn ${cat === 'Tất cả' ? 'active' : 'bg-transparent border border-[#BBF7D0]'}`;
            adBtn.innerText = cat;
            adBtn.onclick = () => {
                document.querySelectorAll('#admin-tags-container .tag-btn').forEach(b => {
                     b.classList.remove('active');
                     b.classList.add('bg-transparent', 'border', 'border-[#BBF7D0]');
                });
                adBtn.classList.add('active');
                adBtn.classList.remove('bg-transparent', 'border', 'border-[#BBF7D0]');
                currentAdminFilter = cat;
                renderAdminList();
            };
            adminTagsContainer.appendChild(adBtn);
        });

        // LUỒNG DỮ LIỆU ĐỒNG BỘ THỜI GIAN THỰC (REAL-TIME)
        let unsubscribe = null;
        function listenToProductsRealtime() {
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            
            // onSnapshot sẽ tự động kích hoạt mỗi khi CÓ BẤT KỲ THAY ĐỔI NÀO trên Database
            unsubscribe = onSnapshot(q, (querySnapshot) => {
                shoesData = [];
                querySnapshot.forEach((doc) => {
                    shoesData.push({ id: doc.id, ...doc.data() });
                });
                
                // Tự động render lại UI
                renderCatalog();
                
                // Nếu đang mở Admin thì render lại kho admin
                if (!adminSec.classList.contains('hidden')) {
                    renderAdminList();
                }
            }, (error) => {
                catalogGrid.innerHTML = '<div class="w-full text-center text-[#14532D] font-medium mt-10">Mất kết nối với máy chủ</div>';
            });
        }

        // Render Lưới Khách hàng
        function renderCatalog() {
            loader.classList.add('hidden');
            catalogGrid.classList.remove('hidden');
            catalogGrid.innerHTML = '';

            let filtered = currentFilter === 'Tất cả' ? shoesData : shoesData.filter(s => s.category === currentFilter);
            if(currentFilter === 'Tất cả' && filtered.length > 40) filtered = filtered.slice(0, 40);

            if(filtered.length === 0) {
                catalogGrid.innerHTML = '<div class="w-full text-center text-[#166534] text-[16px] font-medium mt-10">Chưa có sản phẩm.</div>';
                return;
            }

            filtered.forEach((item, index) => {
                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'masonry-item animate-fade-up';
                // Tạo hiệu ứng load sản phẩm so le (Cái nào render sau sẽ mượt hơn)
                itemWrapper.style.animationDelay = `${index * 0.05}s`;
                
                const card = document.createElement('div');
                // Gắn class fancy-card để tạo hiệu ứng 3D và khung viền đẹp mắt
                card.className = 'cursor-pointer flex flex-col group fancy-card bg-[#F0FDF4] rounded-[20px] border border-[#BBF7D0] p-1.5 shadow-sm';
                
                const optUrl = item.imageUrl.includes("tr=") ? item.imageUrl : item.imageUrl + "?tr=w-600,f-webp,q-85";
                
                const sizeVal = item.sizeText ? item.sizeText.trim() : "";
                const isNoSize = sizeVal === "" || sizeVal.toLowerCase() === "no size";
                
                const noteHtml = item.noteText ? `<p class="text-[15px] md:text-[17px] font-extrabold text-[#14532D] uppercase leading-tight tracking-tight">${item.noteText}</p>` : '';
                const sizeHtml = isNoSize ? '' : `<p class="text-[14px] md:text-[15px] font-bold text-[#166534] uppercase tracking-wide ${item.noteText ? 'mt-1' : ''}">Size: ${item.sizeText}</p>`;
                
                const hasInfo = Boolean(item.noteText || !isNoSize);
                const infoBoxHtml = hasInfo ? `
                    <div class="w-full bg-white/70 rounded-xl py-3 px-3 mt-1.5 flex flex-col items-center justify-center text-center transition-colors duration-300 group-hover:bg-[#DCFCE7]/90">
                        ${noteHtml}
                        ${sizeHtml}
                    </div>
                ` : '';
                
                card.innerHTML = `
                    <div class="w-full bg-white rounded-xl overflow-hidden flex items-center justify-center relative">
                        <!-- Lớp phủ tối nhẹ khi hover -->
                        <div class="absolute inset-0 bg-[#14532D] opacity-0 group-hover:opacity-5 transition-opacity duration-300 z-10 pointer-events-none"></div>
                        <!-- Hiệu ứng Zoom in ảnh -->
                        <img src="${optUrl}" class="w-full h-auto block transition-transform duration-700 ease-out group-hover:scale-110">
                    </div>
                    ${infoBoxHtml}
                `;

                card.onclick = () => {
                    modalImg.src = item.imageUrl + "?tr=w-1000,f-webp,q-90";
                    
                    if (isNoSize) {
                        modalSize.innerText = ""; modalSize.classList.add('hidden');
                    } else {
                        modalSize.innerText = "Size: " + item.sizeText; modalSize.classList.remove('hidden');
                    }
                    
                    if (item.noteText) {
                        modalNote.innerText = item.noteText; modalNote.classList.remove('hidden');
                    } else {
                        modalNote.innerText = ""; modalNote.classList.add('hidden');
                    }
                    
                    modal.classList.remove('hidden');
                };
                
                itemWrapper.appendChild(card);
                catalogGrid.appendChild(itemWrapper);
            });
        }
        
        document.getElementById('close-modal').onclick = () => modal.classList.add('hidden');

        // Logic Admin Login (Vẫn giữ pass 0814)
        document.getElementById('admin-trigger-btn').onclick = () => {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('pass-input').value = '';
            document.getElementById('pass-error').classList.add('hidden');
        };
        document.getElementById('cancel-pass-btn').onclick = () => document.getElementById('password-modal').classList.add('hidden');
        
        document.getElementById('submit-pass-btn').onclick = checkPass;
        document.getElementById('pass-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPass(); });
        
        function checkPass() {
            if (document.getElementById('pass-input').value === '9229') {
                document.getElementById('password-modal').classList.add('hidden');
                adminSec.classList.remove('hidden');
                loadStatsForAdmin();
                renderAdminList();
            } else { document.getElementById('pass-error').classList.remove('hidden'); }
        }
        document.getElementById('close-admin').onclick = () => adminSec.classList.add('hidden');

        // Up ảnh mới
        const uploadBtn = document.getElementById('upload-btn');
        uploadBtn.onclick = async () => {
            const file = document.getElementById('image-input').files[0];
            const size = document.getElementById('upload-size').value.trim();
            const note = document.getElementById('upload-note').value.trim();
            const sts = document.getElementById('upload-status');
            
            if(!file) { sts.innerHTML = "<span class='text-[#14532D]'>Vui lòng chọn hình ảnh.</span>"; return; }
            
            uploadBtn.disabled = true; uploadBtn.innerText = "Đang xử lý...";
            sts.innerHTML = "<span class='text-[#14532D]'>Đang đẩy lên hệ thống...</span>";

            try {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("fileName", "sp-" + Date.now());
                formData.append("folder", "/pintstore"); 

                const resIK = await fetch(IK_UPLOAD_ENDPOINT, { method: "POST", headers: { "Authorization": "Basic " + IK_AUTH }, body: formData });
                if (!resIK.ok) throw new Error("Lỗi API ảnh");
                const ikData = await resIK.json();

                sts.innerHTML = "<span class='text-[#14532D]'>Đang lưu dữ liệu...</span>";
                await addDoc(collection(db, "products"), {
                    imageUrl: ikData.url,
                    imageKitFileId: ikData.fileId,
                    category: activeUploadCategory,
                    sizeText: size, 
                    noteText: note,
                    createdAt: serverTimestamp() 
                });

                sts.innerHTML = "<span class='text-[#14532D]'>Thêm sản phẩm thành công.</span>";
                document.getElementById('image-input').value = '';
                document.getElementById('upload-size').value = '';
                document.getElementById('upload-note').value = '';
                // Không cần gọi fetchProducts() nữa vì onSnapshot đã tự lo việc lấy dữ liệu mới
                
            } catch(e) { sts.innerHTML = `<span class='text-[#DC2626]'>Lỗi: ${e.message}</span>`; }
            
            setTimeout(() => { uploadBtn.disabled = false; uploadBtn.innerText = "Lưu Sản Phẩm"; sts.innerHTML = ""; }, 2500);
        };

        // Xem và Edit kho
        let currentEditId = null;
        const editModal = document.getElementById('admin-edit-modal');
        
        function renderAdminList() {
            adminProductList.innerHTML = '';
            let filtered = currentAdminFilter === 'Tất cả' ? shoesData : shoesData.filter(s => s.category === currentAdminFilter);

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'relative aspect-square bg-[#F0FDF4] group overflow-hidden rounded-xl flex items-center justify-center border border-[#BBF7D0]';
                div.innerHTML = `
                    <img src="${item.imageUrl}?tr=w-300,h-300,fo-auto" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition">
                    <div class="absolute inset-0 bg-white/90 flex flex-col items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity p-2">
                        <button class="edit-btn btn-solid w-full text-[12px] py-2">Sửa</button>
                        <button class="del-btn btn-outline w-full text-[12px] py-2">Xóa</button>
                    </div>
                `;
                
                div.querySelector('.edit-btn').onclick = () => {
                    currentEditId = item.id;
                    document.getElementById('edit-category').value = item.category || 'Giày';
                    document.getElementById('edit-size').value = item.sizeText || '';
                    document.getElementById('edit-note').value = item.noteText || '';
                    document.getElementById('edit-status').innerHTML = '';
                    editModal.classList.remove('hidden');
                };

                div.querySelector('.del-btn').onclick = async () => {
                    const ans = confirm("Xóa vĩnh viễn sản phẩm khỏi hệ thống. Web khác cũng sẽ bị xóa. Tiếp tục?");
                    if(!ans) return;
                    const delSts = document.getElementById('admin-delete-status');
                    delSts.innerText = "Đang tiến hành xóa...";
                    try {
                        await deleteDoc(doc(db, "products", item.id));
                        delSts.innerText = "Đã xóa sản phẩm.";
                        // Không cần gọi fetchProducts() vì onSnapshot sẽ tự động cập nhật lại danh sách
                        setTimeout(() => { delSts.innerText = ""; }, 2000);
                    } catch(e) { delSts.innerText = "Lỗi: " + e.message; }
                };
                adminProductList.appendChild(div);
            });
        }

        document.getElementById('cancel-edit-btn').onclick = () => editModal.classList.add('hidden');
        document.getElementById('save-edit-btn').onclick = async () => {
            const newCat = document.getElementById('edit-category').value;
            const newSize = document.getElementById('edit-size').value.trim();
            const newNote = document.getElementById('edit-note').value.trim();
            const sts = document.getElementById('edit-status');
            
            sts.innerHTML = "<span class='text-[#14532D]'>Đang cập nhật...</span>";
            
            try {
                await updateDoc(doc(db, "products", currentEditId), {
                    category: newCat, sizeText: newSize, noteText: newNote
                });
                sts.innerHTML = "<span class='text-[#14532D]'>Hoàn tất.</span>";
                // Không cần gọi fetchProducts() 
                setTimeout(() => { editModal.classList.add('hidden'); }, 1000);
            } catch(e) { sts.innerHTML = `<span class='text-[#DC2626]'>Lỗi: ${e.message}</span>`; }
        };

        // Khởi chạy App
        async function init() {
            listenToProductsRealtime(); // Mở luồng lắng nghe dữ liệu liên tục
            updatePageViews();
        }
        init();
    </script>
</body>
</html>
