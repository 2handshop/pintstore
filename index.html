        :root {

            color: var(--text-primary);

            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar { width: 0px; height: 0px; display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Background Họa Tiết Lá Bay */
        .leaf-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
            transition: transform 0.5s ease-out;
        }

        .masonry-grid { 
            column-count: 2; 
            column-gap: 16px; 
        }
        .masonry-item { 
            break-inside: avoid; 
            margin-bottom: 24px; 
            display: inline-block;
            width: 100%;
        }
        @media (min-width: 768px) { 
            .masonry-grid { column-count: 3; column-gap: 20px; } 
        }
        @media (min-width: 1024px) { 
            .masonry-grid { column-count: 4; column-gap: 28px; } 
        }

        /* Thẻ sản phẩm Card 3D & Nổi */
        .product-card {
            background: #ffffff;
            border: 1px solid #DCFCE7;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px -2px rgba(20, 83, 45, 0.05);
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px -4px rgba(20, 83, 45, 0.12);
            border-color: #86EFAC;
        }

        .btn-solid {
            background-color: var(--text-primary);
            color: #FFFFFF;
            border-radius: var(--radius-btn);
            padding: 12px 24px;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(20, 83, 45, 0.2);
        }
        .btn-solid:hover { background-color: #166534; box-shadow: 0 6px 20px rgba(20, 83, 45, 0.3); }
        .btn-solid:active { transform: scale(0.96); }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border-radius: var(--radius-btn);
            padding: 12px 24px;
            font-weight: 500;
            font-size: 16px;
            border: 1.5px solid var(--text-primary);
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .btn-outline:hover { background-color: var(--bg-elevated); }
        .btn-outline:active { transform: scale(0.96); }

        .input-flat {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: var(--radius-input);
            padding: 12px 20px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            outline: none;
            width: 100%;
            transition: all 0.2s ease;
        }
        .input-flat:focus {
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
            border-color: var(--text-primary);
        }

        .tag-btn {
            background-color: rgba(240, 253, 244, 0.8);
            color: var(--text-primary);
            border-radius: var(--radius-btn);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.25s ease;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #DCFCE7;
        }
        @media (min-width: 768px) {
            .tag-btn { padding: 9px 22px; font-size: 14px; }
        }
        .tag-btn:hover { background-color: #DCFCE7; }
        .tag-btn.active {
            background-color: var(--text-primary);
            color: #FFFFFF;
            border-color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(20, 83, 45, 0.2);
        }

        @keyframes floatSlow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-15px) rotate(4deg); } }
        .animate-float { animation: floatSlow 7s ease-in-out infinite; }
        
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { opacity: 0; animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-fade-in { opacity: 0; animation: fadeIn 0.3s forwards; }

        const uploadCategoryBtns = document.getElementById('upload-category-btns');
        const adminTagsContainer = document.getElementById('admin-tags-container');
        const adminProductList = document.getElementById('admin-product-list');
        const editSelectCat = document.getElementById('edit-category');

        // Hàm nén ảnh tự động ngay trên trình duyệt trước khi up
        function compressImage(file, maxWidth = 1200, quality = 0.82) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (!blob) {
                                resolve(file);
                                return;
                            }
                            const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", {
                                type: "image/jpeg",
                                lastModified: Date.now()
                            });
                            resolve(compressedFile);
                        }, 'image/jpeg', quality);
                    };
                    img.onerror = () => resolve(file);
                };
                reader.onerror = () => resolve(file);
            });
        }
        
        async function updatePageViews() {
            if(sessionStorage.getItem('visited')) return;
            sessionStorage.setItem('visited', 'true');
            try {
                const now = new Date();
                const vnTime = new Date(now.getTime() + (7 * 60 * 60 * 1000));
                const yyyy = vnTime.getUTCFullYear();
                const mm = String(vnTime.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(vnTime.getUTCDate()).padStart(2, '0');
                
                const dayKey = `${yyyy}-${mm}-${dd}`;
                const monthKey = `${yyyy}-${mm}`;
                
                const statRef = doc(db, 'analytics', 'views');
                await setDoc(statRef, {
                    [dayKey]: increment(1),
                    [monthKey]: increment(1)
                }, { merge: true });
            } catch(e) {}
        }

        async function loadStatsForAdmin() {
            try {
                const now = new Date();
                const vnTime = new Date(now.getTime() + (7 * 60 * 60 * 1000));
                const yyyy = vnTime.getUTCFullYear();
                const mm = String(vnTime.getUTCMonth() + 1).padStart(2, '0');
                const dd = String(vnTime.getUTCDate()).padStart(2, '0');
                const dayKey = `${yyyy}-${mm}-${dd}`;
                const monthKey = `${yyyy}-${mm}`;
                
                const docSnap = await getDoc(doc(db, 'analytics', 'views'));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('stat-today').innerText = data[dayKey] || 0;
                    document.getElementById('stat-month').innerText = data[monthKey] || 0;
                }
            } catch (e) {}
        }

        CATEGORIES.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `tag-btn ${cat === 'Tất cả' ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('#tags-container .tag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = cat;
                renderCatalog();
            };
            tagsContainer.appendChild(btn);
            
            if(cat !== 'Tất cả') {
                const upBtn = document.createElement('button');
                upBtn.className = `tag-btn ${cat === activeUploadCategory ? 'active' : 'bg-transparent border border-[#DCFCE7]'}`;
                upBtn.innerText = cat;
                upBtn.onclick = () => {
                    document.querySelectorAll('#upload-category-btns .tag-btn').forEach(b => {
                        b.classList.remove('active');
                        b.classList.add('bg-transparent', 'border', 'border-[#DCFCE7]');
                    });
                    upBtn.classList.add('active');
                    upBtn.classList.remove('bg-transparent', 'border', 'border-[#DCFCE7]');
                    activeUploadCategory = cat;
                };
                uploadCategoryBtns.appendChild(upBtn);

                const opt = document.createElement('option');
                opt.value = cat; opt.innerText = cat;
                editSelectCat.appendChild(opt);
            }

            const adBtn = document.createElement('button');
            adBtn.className = `tag-btn ${cat === 'Tất cả' ? 'active' : 'bg-transparent border border-[#DCFCE7]'}`;
            adBtn.innerText = cat;
            adBtn.onclick = () => {
                document.querySelectorAll('#admin-tags-container .tag-btn').forEach(b => {
                     b.classList.remove('active');
                     b.classList.add('bg-transparent', 'border', 'border-[#DCFCE7]');
                });
                adBtn.classList.add('active');
                adBtn.classList.remove('bg-transparent', 'border', 'border-[#DCFCE7]');
                currentAdminFilter = cat;
                renderAdminList();
            };
            adminTagsContainer.appendChild(adBtn);
        });

        function listenProductsRealtime() {
            const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
            onSnapshot(q, (querySnapshot) => {
                shoesData = [];
                querySnapshot.forEach((doc) => {
                    shoesData.push({ id: doc.id, ...doc.data() });
                });
                renderCatalog();
                if (!adminSec.classList.contains('hidden')) {
                    renderAdminList();
                }
            }, (error) => {
                catalogGrid.innerHTML = '<div class="w-full text-center text-[#14532D] font-medium mt-10">Mất kết nối với máy chủ</div>';
            });
        }

        function renderCatalog() {
            loader.classList.add('hidden');
            catalogGrid.classList.remove('hidden');
            catalogGrid.innerHTML = '';

            let filtered = currentFilter === 'Tất cả' ? shoesData : shoesData.filter(s => s.category === currentFilter);
            if(currentFilter === 'Tất cả' && filtered.length > 50) filtered = filtered.slice(0, 50);

            if(filtered.length === 0) {
                catalogGrid.innerHTML = '<div class="w-full text-center text-[#15803D] text-[16px] font-medium mt-10">Chưa có sản phẩm trong mục này.</div>';
                return;
            }

            filtered.forEach(item => {
                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'masonry-item animate-fade-up';
                
                const card = document.createElement('div');
                card.className = 'product-card cursor-pointer flex flex-col group';
                
                const optUrl = item.imageUrl.includes("tr=") ? item.imageUrl : item.imageUrl + "?tr=w-600,f-webp,q-85";
                
                const sizeVal = item.sizeText ? item.sizeText.trim() : "";
                const isNoSize = sizeVal === "" || sizeVal.toLowerCase() === "no size";
                
                const noteHtml = item.noteText ? `<p class="text-[15px] md:text-[17px] font-bold text-[#14532D] uppercase leading-tight tracking-tight">${item.noteText}</p>` : '';
                const sizeHtml = isNoSize ? '' : `<p class="text-[14px] md:text-[15px] font-semibold text-[#15803D] uppercase tracking-wide ${item.noteText ? 'mt-1' : ''}">Size: ${item.sizeText}</p>`;
                
                const hasInfo = Boolean(item.noteText || !isNoSize);
                const infoBoxHtml = hasInfo ? `
                    <div class="w-full bg-[#F0FDF4] py-3.5 px-3 flex flex-col items-center justify-center text-center border-t border-[#DCFCE7]">
                        ${noteHtml}
                        ${sizeHtml}
                    </div>
                ` : '';
                
                card.innerHTML = `
                    <div class="w-full bg-[#F0FDF4] overflow-hidden flex items-center justify-center">
                        <img src="${optUrl}" class="w-full h-auto block transition-transform duration-500 group-hover:scale-105">
                    </div>
                    ${infoBoxHtml}
                `;

                card.onclick = () => {
                    modalImg.src = item.imageUrl + "?tr=w-1000,f-webp,q-90";
                    
                    if (isNoSize) {
                        modalSize.innerText = ""; modalSize.classList.add('hidden');
                    } else {
                        modalSize.innerText = "Size: " + item.sizeText; modalSize.classList.remove('hidden');
                    }
                    
                    if (item.noteText) {
                        modalNote.innerText = item.noteText; modalNote.classList.remove('hidden');
                    } else {
                        modalNote.innerText = ""; modalNote.classList.add('hidden');
                    }
                    
                    modal.classList.remove('hidden');
                };
                
                itemWrapper.appendChild(card);
                catalogGrid.appendChild(itemWrapper);
            });
        }
        
        document.getElementById('close-modal').onclick = () => modal.classList.add('hidden');

        document.getElementById('admin-trigger-btn').onclick = () => {
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('pass-input').value = '';
            document.getElementById('pass-error').classList.add('hidden');
        };
        document.getElementById('cancel-pass-btn').onclick = () => document.getElementById('password-modal').classList.add('hidden');
        
        document.getElementById('submit-pass-btn').onclick = checkPass;
        document.getElementById('pass-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPass(); });
        
        function checkPass() {
            if (document.getElementById('pass-input').value === '9229') {
                document.getElementById('password-modal').classList.add('hidden');
                adminSec.classList.remove('hidden');
                loadStatsForAdmin();
                renderAdminList();
            } else { 
                document.getElementById('pass-error').classList.remove('hidden'); 
            }
        }
        document.getElementById('close-admin').onclick = () => adminSec.classList.add('hidden');

        // Logic tải ảnh lên: Đã bổ sung bước nén ảnh tự động
        const uploadBtn = document.getElementById('upload-btn');
        uploadBtn.onclick = async () => {
            const file = document.getElementById('image-input').files[0];
            const size = document.getElementById('upload-size').value.trim();
            const note = document.getElementById('upload-note').value.trim();
            const sts = document.getElementById('upload-status');
            
            if(!file) { sts.innerHTML = "<span>Vui lòng chọn hình ảnh.</span>"; return; }
            
            uploadBtn.disabled = true; uploadBtn.innerText = "Đang xử lý...";
            sts.innerHTML = "<span>Đang tối ưu & nén ảnh...</span>";

            try {
                // Tự động nén ảnh trên máy trước khi gửi
                const compressedFile = await compressImage(file, 1200, 0.82);

                sts.innerHTML = "<span>Đang tải lên hệ thống...</span>";
                const formData = new FormData();
                formData.append("file", compressedFile);
                formData.append("fileName", "sp-" + Date.now());
                formData.append("folder", "/pintstore"); 

                const resIK = await fetch(IK_UPLOAD_ENDPOINT, { 
                    method: "POST", 
                    headers: { "Authorization": IK_AUTH }, 
                    body: formData 
                });
                
                if (!resIK.ok) throw new Error("Lỗi API ảnh");
                const ikData = await resIK.json();

                sts.innerHTML = "<span>Đang lưu thông tin...</span>";
                await addDoc(collection(db, "products"), {
                    imageUrl: ikData.url,
                    imageKitFileId: ikData.fileId,
                    category: activeUploadCategory,
                    sizeText: size, 
                    noteText: note,
                    createdAt: serverTimestamp() 
                });

                sts.innerHTML = "<span>Thêm sản phẩm thành công!</span>";
                document.getElementById('image-input').value = '';
                document.getElementById('upload-size').value = '';
                document.getElementById('upload-note').value = '';
            } catch(e) { 
                sts.innerHTML = `<span>Lỗi: ${e.message}</span>`; 
            }
            
            setTimeout(() => { 
                uploadBtn.disabled = false; 
                uploadBtn.innerText = "Lưu Sản Phẩm"; 
                sts.innerHTML = ""; 
            }, 2500);
        };

        // Xem và Chỉnh sửa sản phẩm trong kho
        let currentEditId = null;
        const editModal = document.getElementById('admin-edit-modal');
        
        function renderAdminList() {
            adminProductList.innerHTML = '';
            let filtered = currentAdminFilter === 'Tất cả' ? shoesData : shoesData.filter(s => s.category === currentAdminFilter);

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'relative aspect-square bg-[#F0FDF4] group overflow-hidden rounded-2xl flex items-center justify-center border border-[#DCFCE7]';
                div.innerHTML = `
                    <img src="${item.imageUrl}?tr=w-300,h-300,fo-auto" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-[#14532D]/80 backdrop-blur-xs flex flex-col items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity p-2">
                        <button class="edit-btn btn-solid w-full text-[12px] py-2 bg-white text-[#14532D] hover:bg-emerald-50">Sửa</button>
                        <button class="del-btn btn-outline w-full text-[12px] py-2 border-white text-white hover:bg-white/20">Xóa</button>
                    </div>
                `;
                
                div.querySelector('.edit-btn').onclick = () => {
                    currentEditId = item.id;
                    document.getElementById('edit-category').value = item.category || 'Giày';
                    document.getElementById('edit-size').value = item.sizeText || '';
                    document.getElementById('edit-note').value = item.noteText || '';
                    document.getElementById('edit-status').innerHTML = '';
                    editModal.classList.remove('hidden');
                };

                div.querySelector('.del-btn').onclick = async () => {
                    if(!confirm("Xóa vĩnh viễn sản phẩm này?")) return;
                    const delSts = document.getElementById('admin-delete-status');
                    delSts.innerText = "Đang tiến hành xóa...";
                    try {
                        await deleteDoc(doc(db, "products", item.id));
                        delSts.innerText = "Đã xóa sản phẩm.";
                        setTimeout(() => { delSts.innerText = ""; }, 2000);
                    } catch(e) { delSts.innerText = "Lỗi: " + e.message; }
                };
                adminProductList.appendChild(div);
            });
        }

        document.getElementById('cancel-edit-btn').onclick = () => editModal.classList.add('hidden');
        document.getElementById('save-edit-btn').onclick = async () => {
            const newCat = document.getElementById('edit-category').value;
            const newSize = document.getElementById('edit-size').value.trim();
            const newNote = document.getElementById('edit-note').value.trim();
            const sts = document.getElementById('edit-status');
            
            sts.innerHTML = "<span>Đang cập nhật...</span>";
            try {
                await updateDoc(doc(db, "products", currentEditId), {
                    category: newCat, sizeText: newSize, noteText: newNote
                });
                sts.innerHTML = "<span>Hoàn tất.</span>";
                setTimeout(() => { editModal.classList.add('hidden'); }, 1000);
            } catch(e) { sts.innerHTML = `<span>Lỗi: ${e.message}</span>`; }
        };

        function init() {
            listenProductsRealtime();
            updatePageViews();
        }
        init();
    </script>
</body>
